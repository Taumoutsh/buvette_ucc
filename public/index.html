<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Buvette UCC</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <h1>Buvette UCC</h1>
    <div class="header-actions">
      <button id="btn-history" class="btn-header" title="Historique">🕐</button>
      <button id="btn-options" class="btn-header" title="Options">⚙️</button>
      <button id="btn-logout" class="btn-header" title="Déconnexion">🚪</button>
    </div>
  </header>

  <!-- Category tabs -->
  <div class="category-tabs">
    <button class="tab active" data-category="food">Nourriture</button>
    <button class="tab" data-category="beverage">Boissons</button>
  </div>

  <!-- Items grid -->
  <div id="items-grid" class="items-grid"></div>

  <!-- Order panel (sticky bottom) -->
  <div id="order-panel" class="order-panel">
    <div class="order-header">
      <span class="order-title">Commande</span>
      <span id="order-total" class="order-total">0,00 &euro;</span>
    </div>
    <div id="order-items" class="order-items"></div>
    <div class="order-actions">
      <button id="btn-reset" class="btn btn-danger">Réinitialiser</button>
      <button id="btn-save" class="btn btn-success">Valider</button>
    </div>
  </div>

  <!-- Confirmation modal -->
  <div id="modal-confirm" class="modal" hidden>
    <div class="modal-content">
      <h2>Confirmer la commande</h2>
      <div id="modal-summary"></div>
      <p class="modal-total">Total : <strong id="modal-total-value"></strong></p>
      <p class="modal-payment-label">Moyen de paiement :</p>
      <div class="modal-actions">
        <button id="modal-confirm-cash" class="btn btn-success">Espèces</button>
        <button id="modal-confirm-card" class="btn btn-primary">Carte</button>
      </div>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn btn-secondary btn-block">Annuler</button>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
